name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish desktop app and CLI (self-contained, single file)
        shell: pwsh
        run: |
          $common = @("-c", "Release", "-r", "win-x64", "--self-contained",
                      "-p:PublishSingleFile=true", "-p:IncludeNativeLibrariesForSelfExtract=true",
                      "-p:EnableCompressionInSingleFile=true", "-p:DebugType=none")
          dotnet publish src/PgCopy.Desktop @common -o publish/desktop
          dotnet publish src/PgCopy.Cli @common -o publish/cli
          Compress-Archive -Path publish/desktop/PgCopy.exe -DestinationPath "pg-copy-desktop-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish/cli/pgcopy.exe -DestinationPath "pg-copy-cli-${{ github.ref_name }}-win-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pg-copy-desktop-*-win-x64.zip
            pg-copy-cli-*-win-x64.zip
